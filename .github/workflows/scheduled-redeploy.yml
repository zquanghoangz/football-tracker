name: Scheduled tournament data refresh

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-tournament-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh tournament data
        run: npm run scrape

      - name: Commit real tournament data changes
        run: |
          if git diff --quiet --ignore-matching-lines='"scrapedAt":' -- src/data/tournaments; then
            echo "No tournament data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tournaments
          git commit -m "refresh tournament data"

          # A code change may land after checkout. Replay the data refresh on the
          # latest master before pushing instead of failing with a non-fast-forward.
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another update (attempt ${attempt}/3). Retrying..."
          done

          echo "Could not push refreshed tournament data after 3 attempts."
          exit 1
